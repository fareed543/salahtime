name: Build Android Release

on:
  workflow_dispatch:
    inputs:
      upload_to_play:
        description: "Upload the generated AAB to Google Play"
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Prepare Android signing inputs
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: frontend
        shell: bash
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/release.keystore
          {
            echo "MYAPP_UPLOAD_STORE_FILE=$GITHUB_WORKSPACE/frontend/android/release.keystore"
            echo "MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } >> android/gradle.properties

      - name: Build web assets
        working-directory: frontend
        run: npm run build:prod

      - name: Sync Capacitor Android project
        working-directory: frontend
        run: npx cap sync android

      - name: Build Android release artifacts
        working-directory: frontend/android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean bundleRelease assembleRelease

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: salah-time-android-release
          path: |
            frontend/android/app/build/outputs/bundle/release/*.aab
            frontend/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload to Google Play
        if: ${{ inputs.upload_to_play && secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.wallet.salahtime
          releaseFiles: frontend/android/app/build/outputs/bundle/release/app-release.aab
          tracks: production
          status: completed

