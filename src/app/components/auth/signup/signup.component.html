<div class="auth-screen auth-screen-signup row gx-3 align-items-center justify-content-center py-4 mt-auto">
  <div class="col-11 col-sm-8 col-md-11 col-xl-11 col-xxl-10 login-box">
    <div class="mb-4">
      <h2 class="mb-0">Welcome to SalahTime</h2>
      <h1 class="fw-bold text-theme-1 auth-title">Sign up now!</h1>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>
      <div class="alert alert-success" *ngIf="successMessage">{{ successMessage }}</div>

      <div class="row gx-3">
        <div class="col">
          <div class="form-floating mb-3">
            <input type="text" class="form-control" id="firstName" placeholder="Enter first name" formControlName="firstName">
            <label for="firstName">First Name</label>
          </div>
        </div>
        <div class="col">
          <div class="form-floating mb-3">
            <input type="text" class="form-control" id="lastName" placeholder="Enter last name" formControlName="lastName">
            <label for="lastName">Last Name</label>
          </div>
        </div>
      </div>

      <div class="form-floating mb-3">
        <input type="email" class="form-control" id="signupEmail" placeholder="Enter email address" formControlName="email">
        <label for="signupEmail">Email Address</label>
      </div>

      <div class="input-group mb-3">
        <div class="form-floating maxwidth-100">
          <select class="form-select" id="countryCode" aria-label="Country code" formControlName="countryCode">
            <option value="+1">+1</option>
            <option value="+44">+44</option>
            <option value="+91">+91</option>
            <option value="+971">+971</option>
          </select>
          <label for="countryCode">Code</label>
        </div>
        <div class="form-floating">
          <input type="text" class="form-control" id="phoneNumber" placeholder="Enter your phone number" formControlName="phone">
          <label for="phoneNumber">Phone Number</label>
        </div>
      </div>

      <div class="position-relative">
        <div class="form-floating mb-3">
          <input [type]="showPassword ? 'text' : 'password'" class="form-control" id="signupPassword"
            placeholder="Enter your password" formControlName="password">
          <label for="signupPassword">Password</label>
        </div>
        <button class="btn btn-square btn-link text-theme-1 position-absolute end-0 top-0 mt-2 me-2" type="button"
          (click)="togglePassword('password')" aria-label="Toggle password visibility">
          <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
        </button>
      </div>

      <div class="position-relative">
        <div class="form-floating mb-3">
          <input [type]="showConfirmPassword ? 'text' : 'password'" class="form-control" id="confirmPassword"
            placeholder="Confirm your password" formControlName="confirmPassword">
          <label for="confirmPassword">Confirm Password</label>
        </div>
        <button class="btn btn-square btn-link text-theme-1 position-absolute end-0 top-0 mt-2 me-2" type="button"
          (click)="togglePassword('confirm')" aria-label="Toggle confirm password visibility">
          <i class="bi" [ngClass]="showConfirmPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
        </button>
      </div>

      <button class="btn btn-lg btn-theme w-100 mb-4" type="submit" [disabled]="submitting">
        {{ submitting ? 'Creating account...' : 'Sign up' }}
      </button>
    </form>
  </div>
</div>
