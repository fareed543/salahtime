      <!-- TIME & DATE CARD -->
      <div class="p-4 border rounded text-center text-light"
        style="background: linear-gradient(135deg, #3b82f6, #06b6d4);">
        <h3 class="mb-1">{{ currentTime }}</h3>
        <h3 class="mb-1">{{ dayOfWeek }}</h3>
        <h3 class="mb-1">{{ day }} - {{ month }} {{ year }}</h3>
        <h3>{{ islamicDateNumber }} - {{ islamicMonthName }} - {{ islamicYear }}</h3>
      </div>
