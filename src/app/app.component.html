<header class="adminuiux-header">
  <nav class="navbar navbar-expand-lg fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" [routerLink]="['/']" routerLinkActive="router-link-active" aria-label="SalahTime home">
        <img data-bs-img="light" src="assets/images/logo.png" alt="SalahTime logo">
        <img data-bs-img="dark" src="assets/images/logo.png" alt="SalahTime logo">
        <div class="">
          <span class="h4">Salah<span class="fw-bold">Time</span></span>
          <p class="company-tagline">Your Salah companion</p>
        </div>
      </a>

      

      <div class="ms-auto">

        <button  class="btn btn-link btn-square btn-link-header"
        aria-label="Rate app on Play Store"
        onclick="window.open('https://play.google.com/store/apps/details?id=com.wallet.salahtime', '_blank')">
        <i class="bi bi-google-play fs-4"></i>
        </button>

        <button class="btn btn-link btn-square btn-icon btn-link-header" type="button" [routerLink]="['/about']"
          aria-label="Help">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="feather feather-help-circle">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        </button>

        <button class="btn btn-link btn-square btnsunmoon btn-link-header" id="btn-layout-modes-dark-page"
          aria-label="Toggle dark mode">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="feather feather-sun sun mx-auto">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="feather feather-moon moon mx-auto">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>


        <div class="dropdown d-inline-block">
          <app-language-selection></app-language-selection>
        </div>

      </div>
    </div>
  </nav>

</header>

<div class="adminuiux-wrap">


  <main class="adminuiux-content" onclick="contentClick()" style="padding-top: 62px;">
    <div class="container mt-3" id="main-content">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>

<footer class="adminuiux-mobile-footer hide-on-scrolldown style-1">
  <div class="container">
    <nav aria-label="Primary navigation">
      <ul class="nav nav-pills nav-justified">

        <!-- Home -->
        <li class="nav-item">
          <a class="nav-link" [routerLink]="['/']" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
            #homeRla="routerLinkActive" [attr.aria-current]="homeRla.isActive ? 'page' : null" aria-label="Home">
            <i class="nav-icon bi bi-house-door-fill" aria-hidden="true"></i>
            <span class="nav-text">{{ 'HOME' | translate }}</span>
          </a>
        </li>

        <!-- Ramzan -->
        <li class="nav-item">
          <a class="nav-link" [routerLink]="['/ramzan']" routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }" #ramzanRla="routerLinkActive"
            [attr.aria-current]="ramzanRla.isActive ? 'page' : null" aria-label="Ramzan 2026">
            <i class="nav-icon bi bi-moon-stars" aria-hidden="true"></i>
            <span class="nav-text">{{ 'RAMZAN_2026' | translate }}</span>
          </a>
        </li>

        <!-- Settings -->
        <li class="nav-item">
          <a class="nav-link" [routerLink]="['/settings']" routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }" #settingsRla="routerLinkActive"
            [attr.aria-current]="settingsRla.isActive ? 'page' : null" aria-label="Settings">
            <i class="nav-icon bi bi-gear-fill" aria-hidden="true"></i>
            <span class="nav-text">{{ 'SETTINGS' | translate }}</span>
          </a>
        </li>

      </ul>
    </nav>

  </div>
</footer>

<!-- standard footer -->
<footer class="adminuiux-footer has-adminuiux-sidebar mt-auto" dir="ltr">
  <div class="container-fluid text-center">
    <span class="small" [innerHTML]="
    ('copyright' | translate:{ version: appVersion })
  "></span>
  </div>
</footer>
