<div class="adminuiux-wrap">


  <main class="adminuiux-content" onclick="contentClick()" style="padding-top: 62px;">

      <!-- welcome -->

    </div>
  </main>
</div>

<!-- mobile footer -->
<footer class="adminuiux-mobile-footer hide-on-scrolldown style-1">
  <div class="container">
    <ul class="nav nav-pills nav-justified">
      <li class="nav-item">
        <a class="nav-link active" [routerLink]="['/']" aria-current="page">
          <span>
            <i class="nav-icon bi bi-house-door-fill"></i>
            <span class="nav-text">{{'HOME' | translate}}</span>
          </span>
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link active" [routerLink]="['/ramzan']" aria-current="page">
          <span>
            <i class="nav-icon bi bi-moon-stars"></i>

          </span>
        </a>
      </li>


      <li class="nav-item">
        <a class="nav-link" [routerLink]="['/settings']">
          <span>
            <i class="nav-icon bi bi-gear-fill"></i>
            <span class="nav-text">{{'SETTINGS' | translate}}</span>
          </span>
        </a>
      </li>
    </ul>
  </div>
</footer>
