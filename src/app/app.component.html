<header class="adminuiux-header">
  <nav class="navbar navbar-expand-lg fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" [routerLink]="['/']" routerLinkActive="router-link-active" aria-label="SalahTime home">
        <img data-bs-img="light" src="assets/images/logo.png" alt="SalahTime logo">
        <img data-bs-img="dark" src="assets/images/logo.png" alt="SalahTime logo">
        <div class="">
          <span class="h4">Salah<span class="fw-bold">Time</span></span>
          <p class="company-tagline">Your Salah companion</p>
        </div>
      </a>

      

      <div class="ms-auto">

         <button class="btn btn-link btn-square btn-link-header p-1 p-md-2"
                aria-label="Rate app on Play Store"
                onclick="window.open('https://play.google.com/store/apps/details?id=com.wallet.salahtime', '_blank')">
          <svg xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" image-rendering="optimizeQuality" fill-rule="evenodd" clip-rule="evenodd"
            viewBox="0 0 466 511.98">
            <g id="Layer_x0020_1">
              <path fill="#EA4335" fill-rule="nonzero" d="M199.9 237.8l-198.5 232.37c7.22,24.57 30.16,41.81 55.8,41.81 11.16,0 20.93,-2.79 29.3,-8.37l0 0 244.16 -139.46 -130.76 -126.35z"/>
              <path fill="#FBBC04" fill-rule="nonzero" d="M433.91 205.1l0 0 -104.65 -60 -111.61 110.22 113.01 108.83 104.64 -58.6c18.14,-9.77 30.7,-29.3 30.7,-50.23 -1.4,-20.93 -13.95,-40.46 -32.09,-50.22z"/>
              <path fill="#34A853" fill-rule="nonzero" d="M199.42 273.45l129.85 -128.35 -241.37 -136.73c-8.37,-5.58 -19.54,-8.37 -30.7,-8.37 -26.5,0 -50.22,18.14 -55.8,41.86 0,0 0,0 0,0l198.02 231.59z"/>
              <path fill="#4285F4" fill-rule="nonzero" d="M1.39 41.86c-1.39,4.18 -1.39,9.77 -1.39,15.34l0 397.64c0,5.57 0,9.76 1.4,15.34l216.27 -214.86 -216.28 -213.46z"/>
            </g>
            </svg>

        </button>
  
        <button class="btn btn-link btn-square btn-icon btn-link-header" type="button" [routerLink]="['/about']"
          aria-label="Help">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="feather feather-help-circle">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        </button>

        <button class="btn btn-link btn-square btnsunmoon btn-link-header" id="btn-layout-modes-dark-page"
          aria-label="Toggle dark mode">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="feather feather-sun sun mx-auto">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="feather feather-moon moon mx-auto">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>


        <div class="dropdown d-inline-block">
          <app-language-selection></app-language-selection>
        </div>

      </div>
    </div>
  </nav>

</header>

<div class="adminuiux-wrap">


  <main class="adminuiux-content" onclick="contentClick()" style="padding-top: 62px;">
    <div class="container mt-3" id="main-content">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>

<footer class="adminuiux-mobile-footer hide-on-scrolldown style-1">
  <div class="container">
    <nav aria-label="Primary navigation">
      <ul class="nav nav-pills nav-justified">

        <!-- Home -->
        <li class="nav-item">
          <a class="nav-link" [routerLink]="['/']" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
            #homeRla="routerLinkActive" [attr.aria-current]="homeRla.isActive ? 'page' : null" aria-label="Home">
            <i class="nav-icon bi bi-house-door-fill" aria-hidden="true"></i>
            <span class="nav-text">{{ 'HOME' | translate }}</span>
          </a>
        </li>

        <!-- Ramzan -->
        <li class="nav-item">
          <a class="nav-link" [routerLink]="['/ramzan']" routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }" #ramzanRla="routerLinkActive"
            [attr.aria-current]="ramzanRla.isActive ? 'page' : null" aria-label="Ramzan 2026">
            <i class="nav-icon bi bi-moon-stars" aria-hidden="true"></i>
            <span class="nav-text">{{ 'RAMZAN_2026' | translate }}</span>
          </a>
        </li>

        <!-- Settings -->
        <li class="nav-item">
          <a class="nav-link" [routerLink]="['/settings']" routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }" #settingsRla="routerLinkActive"
            [attr.aria-current]="settingsRla.isActive ? 'page' : null" aria-label="Settings">
            <i class="nav-icon bi bi-gear-fill" aria-hidden="true"></i>
            <span class="nav-text">{{ 'SETTINGS' | translate }}</span>
          </a>
        </li>

      </ul>
    </nav>

  </div>
</footer>

<!-- standard footer -->
<footer class="adminuiux-footer has-adminuiux-sidebar mt-auto" dir="ltr">
  <div class="container-fluid text-center">
    <span class="small" [innerHTML]="
    ('copyright' | translate:{ version: appVersion })
  "></span>
  </div>
</footer>
