<!-- Pageloader -->


<!-- standard header -->
<header class="adminuiux-header">
  <!-- Fixed navbar -->
  <nav class="navbar navbar-expand-lg fixed-top">
    <div class="container-fluid">
      <!-- logo -->
      <a class="navbar-brand" [routerLink]="['/']" routerLinkActive="router-link-active">
        <img data-bs-img="light" src="assets/images/logo.png" alt="">
        <img data-bs-img="dark" src="assets/images/logo.png" alt="">
        <div class="">
          <span class="h4">Salah<span class="fw-bold">Time</span></span>
          <p class="company-tagline">Your Salah companion</p>
        </div>
      </a>

      <!-- right icons button -->
      <div class="ms-auto">
        <!-- global search toggle -->
        <button class="btn btn-link btn-square btn-icon btn-link-header d-lg-none" type="button" onclick="openSearch()">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="feather feather-search">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
        <!-- dark mode -->
        <button class="btn btn-link btn-square btnsunmoon btn-link-header" id="btn-layout-modes-dark-page">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="feather feather-sun sun mx-auto">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="feather feather-moon moon mx-auto">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <!-- language dropdown -->
        <div class="dropdown d-none d-sm-inline-block">
          <button class="btn btn-link btn-square btn-icon btn-link-header dropdown-toggle no-caret" type="button"
            data-bs-toggle="dropdown" aria-expanded="false"> <i class="bi bi-translate"></i>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item active" data-value="EN">EN - English</a></li>
          </ul>
        </div>
        <!-- notification dropdown -->
        <div class="dropdown d-inline-block">
          <button class="btn btn-link btn-square btn-icon btn-link-header dropdown-toggle no-caret" type="button"
            data-bs-toggle="dropdown" aria-expanded="false">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="feather feather-bell">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
          </button>
          <ul class="dropdown-menu dropdown-menu-end notification-dd">
          </ul>
        </div>
      </div>
    </div>
  </nav>
  <!-- search global wrap -->

</header>
<div class="adminuiux-wrap">


  <main class="adminuiux-content has-sidebar" onclick="contentClick()" style="padding-top: 62px;">
    <!-- content -->
    <div class="container mt-3" id="main-content">
      <!-- welcome -->
      <router-outlet></router-outlet>

    </div>
  </main>
</div>

<!-- theming offcanvas-->

  <div class="offcanvas-header border-bottom">
    <div>
