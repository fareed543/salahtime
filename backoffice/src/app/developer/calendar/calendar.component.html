<div class="container-xxl flex-grow-1 p-0 calendar-admin-page">
  <div class="row g-4">
    <div class="col-12" *ngIf="feedbackMessage">
      <div class="alert alert-success mb-0">{{ feedbackMessage }}</div>
    </div>

    <div class="col-12" *ngIf="errorMessage">
      <div class="alert alert-danger mb-0">{{ errorMessage }}</div>
    </div>

    <div class="col-12 col-xl-6">
      <div class="card h-100">
        <div class="card-header d-flex justify-content-between align-items-center">
          <div>
            <h5 class="mb-1">Manage Calendar</h5>
            <small class="text-muted">Control month-level Hijri date overrides.</small>
          </div>
          <div class="d-flex gap-2">
            <button type="button" class="btn btn-sm btn-outline-primary" (click)="addAdjustment()">Add</button>
            <button type="button" class="btn btn-sm btn-primary" (click)="saveAdjustments()" [disabled]="isSavingAdjustments">
              {{ isSavingAdjustments ? 'Saving...' : 'Save changes' }}
            </button>
          </div>
        </div>

        <div class="card-body">
          <div *ngIf="isLoading" class="text-muted">Loading calendar settings...</div>

          <div *ngIf="!isLoading" class="row g-3">
            <div class="col-12 col-lg-5">
              <div class="list-group calendar-admin-list">
                <button
                  type="button"
                  *ngFor="let item of adjustmentItems; trackBy: trackById"
                  class="list-group-item list-group-item-action"
                  [class.active]="selectedAdjustmentId === item.id"
                  (click)="selectAdjustment(item)">
                  <div class="fw-semibold">{{ getMonthLabel(item.hijriMonth) }} {{ item.hijriYear }}</div>
                  <small class="d-block">Original: {{ item.originalStartDate }} to {{ item.originalEndDate }}</small>
                  <small class="d-block">Updated: {{ item.updatedStartDate }} to {{ item.updatedEndDate }}</small>
                </button>
              </div>
            </div>

            <div class="col-12 col-lg-7" *ngIf="selectedAdjustment as item">
              <div class="row g-3">
                <div class="col-12">
                  <label class="form-label">Islamic month</label>
                  <select [(ngModel)]="item.hijriMonth" (ngModelChange)="onHijriMonthChange(item)" class="form-select" name="hijriMonth">
                    <option *ngFor="let month of hijriMonths" [value]="month.value">{{ month.label }}</option>
                  </select>
                </div>

                <div class="col-12">
                  <label class="form-label">Hijri year</label>
                  <select [(ngModel)]="item.hijriYear" (ngModelChange)="onHijriMonthChange(item)" class="form-select" name="hijriYear">
                    <option *ngFor="let year of hijriYears" [value]="year">{{ year }}</option>
                  </select>
                </div>

                <div class="col-12">
                  <label class="form-label">Original start date</label>
                  <input type="date" [ngModel]="item.originalStartDate" class="form-control" name="originalStartDate" readonly />
                </div>

                <div class="col-12">
                  <label class="form-label">Original end date</label>
                  <input type="date" [ngModel]="item.originalEndDate" class="form-control" name="originalEndDate" readonly />
                </div>

                <div class="col-12">
                  <label class="form-label">Updated start date</label>
                  <input type="date" [(ngModel)]="item.updatedStartDate" class="form-control" name="updatedStartDate" />
                </div>

                <div class="col-12">
                  <label class="form-label">Updated end date</label>
                  <input type="date" [(ngModel)]="item.updatedEndDate" class="form-control" name="updatedEndDate" />
                </div>

                <div class="col-12">
                  <label class="form-label">Notes</label>
                  <textarea [(ngModel)]="item.notes" class="form-control" rows="4" name="adjustmentNotes"></textarea>
                </div>

                <div class="col-12 d-flex justify-content-between align-items-center">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" [(ngModel)]="item.isActive" name="adjustmentActive" [id]="'adjustmentActive' + item.id" />
                    <label class="form-check-label" [for]="'adjustmentActive' + item.id">Active</label>
                  </div>
                  <button type="button" class="btn btn-outline-danger" (click)="removeSelectedAdjustment()">Delete</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-12 col-xl-6">
      <div class="card h-100">
        <div class="card-header d-flex justify-content-between align-items-center">
          <div>
            <h5 class="mb-1">Manage Holiday / Special Date</h5>
            <small class="text-muted">One day can hold multiple special events.</small>
          </div>
          <div class="d-flex gap-2">
            <button type="button" class="btn btn-sm btn-outline-primary" (click)="addSpecialDate()">Add</button>
            <button type="button" class="btn btn-sm btn-primary" (click)="saveSpecialDates()" [disabled]="isSavingSpecialDates">
              {{ isSavingSpecialDates ? 'Saving...' : 'Save changes' }}
            </button>
          </div>
        </div>

        <div class="card-body">
          <div *ngIf="isLoading" class="text-muted">Loading special dates...</div>

          <div *ngIf="!isLoading" class="row g-3">
            <div class="col-12 col-lg-5">
              <div class="list-group calendar-admin-list">
                <button
                  type="button"
                  *ngFor="let item of specialDateItems; trackBy: trackById"
                  class="list-group-item list-group-item-action"
                  [class.active]="selectedSpecialDateId === item.id"
                  (click)="selectSpecialDate(item)">
                  <div class="fw-semibold">{{ item.title || 'Untitled special date' }}</div>
                  <small class="d-block">{{ item.eventDate }}</small>
                  <small class="d-block text-truncate">{{ item.description || 'No description' }}</small>
                </button>
              </div>
            </div>

            <div class="col-12 col-lg-7" *ngIf="selectedSpecialDate as item">
              <div class="row g-3">
                <div class="col-12">
                  <label class="form-label">Title</label>
                  <input type="text" [(ngModel)]="item.title" class="form-control" name="specialTitle" />
                </div>

                <div class="col-12">
                  <label class="form-label">Event date</label>
                  <input type="date" [(ngModel)]="item.eventDate" class="form-control" name="specialDate" />
                </div>

                <div class="col-12">
                  <label class="form-label">Description</label>
                  <textarea [(ngModel)]="item.description" class="form-control" rows="5" name="specialDescription"></textarea>
                </div>

                <div class="col-12 d-flex justify-content-between align-items-center">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" [(ngModel)]="item.isActive" name="specialActive" [id]="'specialActive' + item.id" />
                    <label class="form-check-label" [for]="'specialActive' + item.id">Active</label>
                  </div>
                  <button type="button" class="btn btn-outline-danger" (click)="removeSelectedSpecialDate()">Delete</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
