<div class="content-wrapper">
  <div class="container-xxl flex-grow-1 container-p-y">
    <div class="page-head mb-4">
      <app-foundation-title title="Settings" subtitle="Application-wide configuration, grouped by section."></app-foundation-title>
      <app-foundation-breadcrumb [items]="breadcrumbs" listClass="breadcrumb mb-2"></app-foundation-breadcrumb>
    </div>

    <div *ngIf="isLoading" class="alert alert-primary">Loading settings...</div>
    <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

    <div class="row g-4" *ngIf="!isLoading && settings">
      <div class="col-lg-3">
        <div class="card settings-nav">
          <div class="list-group list-group-flush">
            <button *ngFor="let item of sectionNav" type="button"
              class="list-group-item list-group-item-action d-flex align-items-center gap-2"
              [class.active]="activeSection === item.key" (click)="selectSection(item.key)">
              <i [class]="item.icon"></i>
              <span>{{ item.label }}</span>
            </button>
          </div>
        </div>
      </div>

      <div class="col-lg-9 d-grid gap-4">
        <app-auth-channels-section [section]="settings.authChannels" (saved)="loadSettings()"></app-auth-channels-section>
        <app-sms-provider-section [section]="settings.smsProvider" (saved)="loadSettings()"></app-sms-provider-section>
      </div>
    </div>
  </div>
</div>
