<h4 class="mb-2">{{ 'Reset Password' | appTranslate }}</h4>
<p class="mb-4">{{ 'Set a new password for {{email}}.' | appTranslate:{ email: email } }}</p>

<div *ngIf="errorMessage" class="alert alert-danger" role="alert">{{ errorMessage }}</div>
<div *ngIf="successMessage" class="alert alert-success" role="alert">{{ successMessage }}</div>

<form class="mb-3" [formGroup]="form" (ngSubmit)="submit()">
  <div class="mb-3">
    <label for="code" class="form-label">{{ 'Reset Code' | appTranslate }}</label>
    <input
      type="text"
      class="form-control"
      id="code"
      formControlName="code"
      [placeholder]="'Enter the code from your email' | appTranslate"
      autofocus
    />
  </div>

  <div class="mb-3 form-password-toggle">
    <label class="form-label" for="password">{{ 'New Password' | appTranslate }}</label>
    <div class="input-group input-group-merge">
      <input
        [type]="showPassword ? 'text' : 'password'"
        id="password"
        class="form-control"
        formControlName="password"
        [placeholder]="'Enter new password' | appTranslate"
      />
      <button class="input-group-text cursor-pointer" type="button" (click)="togglePassword('password')">
        <i class="bx" [ngClass]="showPassword ? 'bx-show' : 'bx-hide'"></i>
      </button>
    </div>
  </div>

  <div class="mb-3 form-password-toggle">
    <label class="form-label" for="confirmPassword">{{ 'Confirm Password' | appTranslate }}</label>
    <div class="input-group input-group-merge">
      <input
        [type]="showConfirmPassword ? 'text' : 'password'"
        id="confirmPassword"
        class="form-control"
        formControlName="confirmPassword"
        [placeholder]="'Confirm new password' | appTranslate"
      />
      <button class="input-group-text cursor-pointer" type="button" (click)="togglePassword('confirm')">
        <i class="bx" [ngClass]="showConfirmPassword ? 'bx-show' : 'bx-hide'"></i>
      </button>
    </div>
  </div>

  <button class="btn btn-primary d-grid w-100" type="submit" [disabled]="submitting">
    {{ submitting ? ('Updating...' | appTranslate) : ('Reset Password' | appTranslate) }}
  </button>
</form>

<div class="text-center">
  <a [routerLink]="['/login']" class="d-flex align-items-center justify-content-center">
    <i class="bx bx-chevron-left scaleX-n1-rtl bx-sm"></i>
    {{ 'Back to login' | appTranslate }}
  </a>
</div>
