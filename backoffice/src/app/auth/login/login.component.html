<h4 class="mb-2">Welcome back</h4>
<p class="mb-4">Sign in to manage SalahTime from your backoffice panel.</p>

<div *ngIf="errorMessage" class="alert alert-danger" role="alert">{{ errorMessage }}</div>

<form class="mb-3" [formGroup]="form" (ngSubmit)="login()">
  <div class="mb-3">
    <label for="phone" class="form-label">Mobile Number</label>
    <input
      type="tel"
      class="form-control"
      id="phone"
      formControlName="phone"
      placeholder="Enter 10 digit mobile number"
      inputmode="numeric"
      autofocus
    />
    <small class="text-danger" *ngIf="form.get('phone')?.touched && form.get('phone')?.invalid">
      Enter a valid 10 digit mobile number.
    </small>
  </div>

  <div class="mb-3 form-password-toggle">
    <div class="d-flex justify-content-between">
      <label class="form-label" for="password">Password</label>
      <a [routerLink]="['/forgot-password']">
        <small>Forgot Password?</small>
      </a>
    </div>
    <div class="input-group input-group-merge">
      <input
        [type]="showPassword ? 'text' : 'password'"
        id="password"
        class="form-control"
        formControlName="password"
        placeholder="Enter your password"
        aria-describedby="password"
      />
      <button class="input-group-text cursor-pointer" type="button" (click)="togglePassword()">
        <i class="bx" [ngClass]="showPassword ? 'bx-show' : 'bx-hide'"></i>
      </button>
    </div>
    <small class="text-danger" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
      Password must be at least 8 characters.
    </small>
  </div>

  <div class="mb-3">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="remember-me" formControlName="rememberMe" />
      <label class="form-check-label" for="remember-me">Remember Me</label>
    </div>
  </div>

  <div class="mb-3">
    <button class="btn btn-primary d-grid w-100" type="submit" [disabled]="submitting">
      {{ submitting ? 'Signing in...' : 'Sign in' }}
    </button>
  </div>
</form>

<p class="text-center text-muted mb-0">Backoffice access uses the same SalahTime account APIs and database.</p>
