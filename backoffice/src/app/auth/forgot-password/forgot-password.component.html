<h4 class="mb-2">Forgot Password?</h4>
<p class="mb-4">Enter your account email and we will start the SalahTime password reset flow.</p>

<div *ngIf="errorMessage" class="alert alert-danger" role="alert">{{ errorMessage }}</div>
<div *ngIf="successMessage" class="alert alert-success" role="alert">{{ successMessage }}</div>

<form class="mb-3" [formGroup]="form" (ngSubmit)="submit()">
  <div class="mb-3">
    <label for="email" class="form-label">Email</label>
    <input
      type="email"
      class="form-control"
      id="email"
      formControlName="email"
      placeholder="Enter your email"
      autofocus
    />
    <small class="text-danger" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
      Enter a valid email address.
    </small>
  </div>
  <button class="btn btn-primary d-grid w-100" type="submit" [disabled]="submitting">
    {{ submitting ? 'Sending...' : 'Send Reset Link' }}
  </button>
</form>

<div class="text-center">
  <a [routerLink]="['/login']" class="d-flex align-items-center justify-content-center">
    <i class="bx bx-chevron-left scaleX-n1-rtl bx-sm"></i>
    Back to login
  </a>
</div>
