<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Masjid display board mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap">
<style>
body{margin:0}
.board{width:1920px;height:1080px;box-sizing:border-box;padding:52px 64px;display:grid;grid-template-columns:minmax(0,1fr) 540px;gap:44px;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;font-variant-numeric:tabular-nums;overflow:hidden}
.col{display:flex;flex-direction:column;gap:30px;min-width:0}
h1{margin:0;font-size:54px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.addr{margin:6px 0 0;font-size:24px;color:var(--muted)}
.panel{background:var(--card);border-radius:24px;padding:14px 18px;border:1px solid var(--line)}
.row{display:grid;align-items:center}
.main .row{grid-template-columns:1.7fr 1fr 1fr 1fr 1.1fr;height:80px;padding:0 22px;border-radius:16px;font-size:34px;font-weight:600}
.main .hd{height:auto;padding:12px 22px;font-size:18px;font-weight:700;letter-spacing:.14em;color:var(--muted)}
.main .next{background:var(--accent);color:var(--accent-text)}
.main .past{color:var(--muted)}
.nm{display:flex;align-items:baseline;gap:16px;font-weight:700}
.ar{font-family:Amiri,serif;font-size:32px;font-weight:400;color:var(--accent-on-bg)}
.next .ar{color:inherit}.past .ar{color:var(--muted)}
.jm{font-weight:800;font-size:38px}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;flex-grow:1}
.sm .row{grid-template-columns:1.4fr 1fr 1fr;height:54px;padding:0 18px;border-radius:12px;font-size:26px;font-weight:600}
.sm .hd{height:auto;padding:10px 18px;font-size:17px;font-weight:700;letter-spacing:.14em;color:var(--accent-on-bg)}
.sm .now{background:var(--line);box-shadow:inset 0 0 0 2px var(--accent)}
.tag{font-size:14px;font-weight:800;letter-spacing:.1em;padding:4px 10px;border-radius:999px;background:var(--accent);color:var(--accent-text);margin-left:12px}
.mk .hd{color:var(--makruh)}
.mk .row:not(.hd){border-bottom:1px solid var(--line);border-radius:0}
.mk .row span:first-child{color:var(--makruh)}
aside{background:var(--accent);color:var(--accent-text);border-radius:32px;padding:44px 40px;display:flex;flex-direction:column;justify-content:space-between;text-align:center}
aside p{margin:0}
.clock{display:flex;justify-content:center;align-items:flex-start;gap:10px;line-height:.9}
.big{font-size:150px;font-weight:800;letter-spacing:-.04em}
.cd1{border-top:2px solid var(--aside-line);padding-top:26px}
.jbox{background:var(--bg);color:var(--text);border-radius:22px;padding:22px 18px;margin-top:18px}
</style>
</head>
<body>
<div class="board" id="b"></div>
<script>
const themes={emerald:['#0c2b25','#123a32','#e6b15c'],sand:['#f5eedf','#fffaf0','#7a5a1d'],midnight:['#0b1222','#131c33','#38bdf8']};
const [bg,card,accent]=themes[new URLSearchParams(location.search).get('t')||'emerald'];
const lum=h=>{h=h.slice(1);return[0,2,4].map(i=>{const v=parseInt(h.slice(i,i+2),16)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}).reduce((a,v,i)=>a+v*[.2126,.7152,.0722][i],0)};
const dark=lum(bg)<.35,aDark=lum(accent)<.35,text=dark?'#f7f3ea':'#2a2116';
const vars={'--bg':bg,'--card':card,'--accent':accent,'--text':text,'--muted':dark?'rgba(247,243,234,.62)':'rgba(42,33,22,.62)','--line':dark?'rgba(255,255,255,.08)':'rgba(42,33,22,.12)','--accent-text':aDark?'#fffaf0':'#1f1608','--aside-line':aDark?'rgba(255,250,240,.25)':'rgba(31,22,8,.18)','--accent-on-bg':Math.abs(lum(accent)-lum(bg))>.25?accent:text,'--makruh':dark?'#f4a491':'#a3412a'};
const b=document.getElementById('b');Object.entries(vars).forEach(([k,v])=>b.style.setProperty(k,v));
const salah=[['Fajr','الفجر','04:50 AM','06:02 AM','04:55 AM','05:30 AM','past'],['Dhuhr','الظهر','11:57 AM','04:12 PM','12:45 PM','01:15 PM','next'],['Asr','العصر','04:12 PM','05:46 PM','04:19 PM','04:40 PM',''],['Maghrib','المغرب','05:49 PM','06:34 PM','06:05 PM','06:15 PM',''],['Isha','العشاء','07:02 PM','04:50 AM','08:15 PM','08:30 PM','']];
const nafil=[['Tahajjud','02:40 AM','03:19 AM'],['Ishraq','06:22 AM','07:32 AM'],['Chasht','07:32 AM','11:42 AM',1],['Awwabin','06:09 PM','06:34 PM']];
const makruh=[['Sunrise','06:02 AM','06:22 AM'],['Zawal','11:47 AM','11:57 AM'],['Sunset','05:46 PM','05:49 PM']];
b.innerHTML=`<div class="col">
<header><h1>Usmaniya Jamia Masjid and Ismail Center</h1><p class="addr">Kelambakkam, Chennai Metropolitan Area</p></header>
<section class="panel main"><div class="row hd"><span>SALAH</span><span>STARTS</span><span>ENDS</span><span>AZAN</span><span>JAMAT</span></div>
${salah.map(s=>`<div class="row ${s[6]}"><span class="nm">${s[0]}<span class="ar">${s[1]}</span></span><span>${s[2]}</span><span>${s[3]}</span><span>${s[4]}</span><span class="jm">${s[5]}</span></div>`).join('')}</section>
<div class="pair"><section class="panel sm"><div class="row hd"><span>NAFIL</span><span>STARTS</span><span>ENDS</span></div>
${nafil.map(n=>`<div class="row ${n[3]?'now':''}"><span>${n[0]}${n[3]?'<span class="tag">NOW</span>':''}</span><span>${n[1]}</span><span>${n[2]}</span></div>`).join('')}</section>
<section class="panel sm mk"><div class="row hd"><span>MAKRUH</span><span>STARTS</span><span>ENDS</span></div>
${makruh.map(m=>`<div class="row"><span>${m[0]}</span><span>${m[1]}</span><span>${m[2]}</span></div>`).join('')}</section></div></div>
<aside><div><div class="clock"><span class="big">08:41</span><span style="display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding-top:14px"><span style="font-size:34px;font-weight:800">AM</span><span style="font-size:28px;font-weight:600;opacity:.7">02</span></span></div>
<p style="margin-top:18px;font-size:26px;font-weight:700">Monday, 26 October 2026</p><p style="font-size:24px;font-weight:500;opacity:.8">14 Jumada al-Awwal 1448 AH</p></div>
<div><div class="cd1"><p style="font-size:24px;font-weight:700;opacity:.8">Dhuhr azan in</p><p style="font-size:76px;font-weight:800;letter-spacing:-.02em">04:03:57</p><p style="font-size:20px;font-weight:600;opacity:.7">at 12:45 PM</p></div>
<div class="jbox"><p style="font-size:24px;font-weight:700;color:var(--accent-on-bg)">Dhuhr jamat in</p><p style="font-size:88px;font-weight:800;letter-spacing:-.02em;line-height:1.05">04:33:57</p><p style="font-size:20px;font-weight:600;color:var(--muted)">at 01:15 PM</p></div></div>
<div style="font-size:18px;font-weight:600;opacity:.8;display:flex;flex-direction:column;gap:8px"><span>Beep at azan and jamat</span><span>Timings last updated 12 Oct 2026</span></div></aside>`;
</script>
</body>
</html>
