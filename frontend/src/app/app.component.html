<section class="app-startup-screen" *ngIf="!initialized" role="status" aria-live="polite">
  <div class="app-startup-card">
    <img src="assets/images/logo.png" alt="SalahTime" class="app-startup-logo">
    <h1 class="app-startup-title">SalahTime</h1>
    <p class="app-startup-message">{{ startupMessage }}</p>
    <div class="app-startup-progress" aria-hidden="true">
      <span [style.width.%]="startupProgress"></span>
    </div>
  </div>
</section>

<app-onboarding
  *ngIf="initialized && showOnboarding"
  (completed)="onOnboardingCompleted()">
</app-onboarding>

<ng-container *ngIf="initialized && !showOnboarding">
  <div class="alert alert-warning app-missed-prayer-banner m-3 mb-0 d-flex align-items-center justify-content-between gap-3"
    *ngIf="missedPrayerMessage$ | async as missedPrayerMessage">
    <span>{{ 'APP.MISSED_PRAYER.MESSAGE' | translate:{ salah: missedPrayerMessage.salah, city: missedPrayerMessage.city } }}</span>
    <button type="button" class="btn btn-sm btn-outline-dark" (click)="dismissMissedPrayerMessage()">{{ 'APP.MISSED_PRAYER.DISMISS' | translate }}</button>
  </div>
  <router-outlet></router-outlet>
  <!-- <app-spinner-overlay></app-spinner-overlay> -->
  <app-offline-screen></app-offline-screen>
</ng-container>
