<div class="row gx-3 mx-0 qibla-page">
  <div class="col-12">
    <div class="row gx-3 align-items-center mb-3 mx-0 qibla-header-row">
      <div class="col qibla-header-main">
        <div class="qibla-header-text">
          <h1 class="mb-0 qibla-title">Qibla Compass</h1>
          <p class="text-theme-1 mb-0 salah-time-range qibla-header-meta">{{ locationLabel }}</p>
        </div>
      </div>
      <div class="col-auto text-end">
        <div class="qibla-vibration-control">
          <div class="qibla-vibration-toggle" role="group" aria-label="Vibration toggle">
            <button
              type="button"
              class="qibla-toggle-btn"
              [class.active]="vibrationEnabled"
              [attr.aria-label]="vibrationEnabled ? 'Vibration on' : 'Vibration off'"
              [attr.aria-pressed]="vibrationEnabled"
              (click)="vibrationEnabled = !vibrationEnabled"
            >
              <i class="bi bi-phone-vibrate"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="col-12" *ngIf="canShowCompass; else qiblaSetupState">
    <div class="card adminuiux-card shadow-sm border-0 mb-3">
      <div class="card-body qibla-card-body">
        <div class="qibla-compass-wrap">
          <div class="qibla-dial">
            <div
              class="qibla-compass-face"
              [attr.data-theme]="selectedCompassTheme"
              [style.--qibla-theme-ring]="activeCompassTheme.ring"
              [style.--qibla-theme-face]="activeCompassTheme.face"
              [style.--qibla-theme-needle]="activeCompassTheme.needle"
              [style.transform]="'translate(-50%, -50%) rotate(' + (-heading) + 'deg)'"
            >
              <div class="qibla-dial-outer"></div>
              <div class="qibla-dial-middle"></div>
              <div class="qibla-dial-inner"></div>
              <div class="qibla-tick-ring"></div>
              <div class="qibla-cardinal qibla-cardinal-top">N</div>
              <div class="qibla-cardinal qibla-cardinal-right">E</div>
              <div class="qibla-cardinal qibla-cardinal-bottom">S</div>
              <div class="qibla-cardinal qibla-cardinal-left">W</div>
              <div class="qibla-kaaba-mark" [style.transform]="'translate(-50%, -50%) rotate(' + kaabaBearing + 'deg) translateY(-132px)'">
                <img src="assets/images/pointer.png" alt="Kaaba marker">
              </div>
            </div>
            <div class="qibla-pointer">
              <div class="qibla-pointer-shape"></div>
            </div>
            <div class="qibla-center-dot">
              <span class="qibla-center-core"></span>
            </div>
          </div>
        </div>

        <div class="qibla-direction-options">
          <div class="qibla-option">
            <div class="qibla-option-label">Qibla</div>
            <div class="qibla-option-value">{{ kaabaBearing | number:'1.0-0' }}&deg;</div>
          </div>
          <div class="qibla-option">
            <div class="qibla-option-label">Heading</div>
            <div class="qibla-option-value">{{ heading | number:'1.0-0' }}&deg;</div>
          </div>
          <div class="qibla-option">
            <div class="qibla-option-label">Direction</div>
            <div class="qibla-option-value">{{ directionLabel }}</div>
          </div>
        </div>

        <div class="qibla-theme-panel">
          <div class="qibla-theme-header">
            <h2 class="h6 mb-1">Compass Themes</h2>
            <p class="mb-0">Choose the compass style you like</p>
          </div>

          <div class="qibla-theme-list" role="list" aria-label="Compass themes">
            <button
              *ngFor="let theme of compassThemes"
              type="button"
              class="qibla-theme-btn"
              [class.active]="selectedCompassTheme === theme.id"
              (click)="selectCompassTheme(theme.id)"
            >
              <span
                class="qibla-theme-preview"
                [style.--preview-ring]="theme.ring"
                [style.--preview-face]="theme.face"
                [style.--preview-needle]="theme.needle"
              >
                <span class="qibla-theme-preview-inner"></span>
                <span class="qibla-theme-preview-needle"></span>
                <span class="qibla-theme-preview-dot"></span>
              </span>
              <span class="qibla-theme-name">{{ theme.name }}</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <ng-template #qiblaSetupState>
    <div class="col-12">
      <div class="card adminuiux-card shadow-sm border-0 mb-3">
        <div class="card-body text-center">
          <img src="assets/images/figure-8-compass-calibration.gif" alt="Compass calibration" class="qibla-calibration mb-3">
          <h5 class="mb-2">Qibla Compass</h5>
          <div class="alert alert-warning mb-3" *ngIf="errorMessage">{{ errorMessage }}</div>
          <div class="alert alert-info mb-3" *ngIf="permissionHint">{{ permissionHint }}</div>
          <div class="text-secondary small mb-3" *ngIf="!errorMessage && !permissionHint">
            {{ calibrationMessage }}
          </div>
          <button class="btn btn-theme px-4" type="button" (click)="refresh()">
            {{ canShowCompass ? 'Refresh Direction' : 'Retry Setup' }}
          </button>
        </div>
      </div>
    </div>
  </ng-template>
</div>
