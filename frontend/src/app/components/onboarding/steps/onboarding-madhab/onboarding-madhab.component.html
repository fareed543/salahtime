<div class="onboarding-screen">
  <div class="hero hero-madhab">
    <img src="assets/images/logo.webp" alt="Madhab" class="hero-logo">
  </div>

  <h1 class="title">{{ 'ONBOARDING.MADHAB_TITLE' | translate }}</h1>
  <p class="subtitle">{{ 'ONBOARDING.MADHAB_SUBTITLE' | translate }}</p>

  <div class="option-list">
    <button
      type="button"
      class="option-card"
      [class.active]="selectedMadhab === 'Hanafi'"
      (click)="selectedMadhabChange.emit('Hanafi')">
      {{ 'MADHAB_HANAFI' | translate }}
    </button>
    <button
      type="button"
      class="option-card"
      [class.active]="selectedMadhab === 'Shafii'"
      (click)="selectedMadhabChange.emit('Shafii')">
      {{ 'ONBOARDING.MADHAB_STANDARD' | translate }}
    </button>
  </div>

  <button type="button" class="primary-btn" (click)="finish.emit()">{{ 'ONBOARDING.NEXT' | translate }}</button>
</div>
