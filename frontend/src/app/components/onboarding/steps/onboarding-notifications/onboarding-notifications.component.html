<div class="onboarding-screen">
  <div class="hero hero-notification">
    <div class="notification-illustration">
      <i class="bi bi-bell-fill"></i>
    </div>
  </div>

  <h1 class="title">Turn On Notifications</h1>
  <p class="subtitle">Enable notifications to get useful reminders and important updates.</p>

  <button type="button" class="primary-btn" (click)="turnOn.emit()">Turn On</button>
  <button type="button" class="ghost-btn" (click)="skip.emit()">Not Now</button>
</div>
