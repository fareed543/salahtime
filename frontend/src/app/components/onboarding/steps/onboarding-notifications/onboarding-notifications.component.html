<div class="onboarding-screen">
  <div class="hero hero-notification">
    <div class="notification-illustration">
      <i class="bi bi-bell-fill"></i>
    </div>
  </div>

  <h1 class="title">{{ 'ONBOARDING.NOTIFICATIONS_TITLE' | translate }}</h1>
  <p class="subtitle">{{ 'ONBOARDING.NOTIFICATIONS_SUBTITLE' | translate }}</p>

  <button type="button" class="primary-btn" (click)="turnOn.emit()">{{ 'ONBOARDING.TURN_ON' | translate }}</button>
  <button type="button" class="ghost-btn" (click)="skip.emit()">{{ 'ONBOARDING.NOT_NOW' | translate }}</button>
</div>
