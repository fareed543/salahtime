<div class="sc" [ngClass]="styleClass" [class.sc-tile]="mode === 'tile'" [class.sc-full]="mode === 'full'">
  <img *ngIf="card.imageUrl" class="sc-bg" [src]="mode === 'tile' ? (card.thumbUrl || card.imageUrl) : card.imageUrl" alt=""
       [attr.width]="mode === 'tile' ? 360 : 1080" [attr.height]="mode === 'tile' ? 640 : 1920"
       [attr.loading]="eager ? 'eager' : 'lazy'">
  <span class="sc-deco" aria-hidden="true"></span>

  <div class="sc-top">
    <p class="sc-logo"><i aria-hidden="true"></i>SALAHTIME · SUNNAH</p>
    <!-- Grid tiles are links: their headline is plain text, the page has its own h1/h2. -->
    <p *ngIf="mode === 'tile'" class="sc-hl" [attr.lang]="headlineLang">
      <span *ngFor="let s of headline; trackBy: trackIndex" [class.sc-em]="s.accent" [class.sc-ar]="s.arabic">{{ s.text }}</span>
    </p>
    <h2 *ngIf="mode === 'full'" class="sc-hl" [attr.lang]="headlineLang">
      <span *ngFor="let s of headline; trackBy: trackIndex" [class.sc-em]="s.accent" [class.sc-ar]="s.arabic">{{ s.text }}</span>
    </h2>
  </div>

  <ng-container *ngIf="mode === 'full'">
    <span class="sc-rule" aria-hidden="true"></span>
    <p *ngIf="card.zikr?.arabic" class="sc-zikr" lang="ar" dir="rtl">{{ card.zikr?.arabic }}</p>
    <p class="sc-body" [attr.lang]="bodyLang">
      <span *ngFor="let s of body; trackBy: trackIndex" [class.sc-ar]="s.arabic">{{ s.text }}</span>
    </p>
    <button *ngIf="hasMore" type="button" class="sc-more" (click)="more.emit()">{{ 'SHORTS.MORE' | translate }} ›</button>
  </ng-container>

  <span *ngIf="label" class="sc-lab">{{ label }}</span>
</div>
