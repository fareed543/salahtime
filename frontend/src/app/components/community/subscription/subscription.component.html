<div class="row gx-3">

    <div class="col-12">
    <app-screen-header
      [title]="'Subscriptions'"
      ></app-screen-header>
  </div>


  <div class="col-12" *ngIf="!loading && programList.length === 0">
    <div class="card adminuiux-card shadow-sm border-0 community-empty-card">
      <div class="card-body text-center py-5">
        <span class="community-empty-icon">
          <i class="bi bi-person-lines-fill"></i>
        </span>
        <h5 class="mt-3 mb-2">No subscriptions found</h5>
        <p class="text-secondary mb-0">Subscription records will appear here once programs are available.</p>
      </div>
    </div>
  </div>


  <div class="col-12" *ngIf="programList.length > 0">
    <div class="card adminuiux-card shadow-sm border-0 mb-3">
      <div class="card-body">
        <div class="input-group">
          <input
            type="text"
            class="form-control"
            placeholder="Search subscribers"
            [(ngModel)]="query"
            (ngModelChange)="applyFilters()"
          >
          <button class="btn btn-light border" type="button" (click)="clearQuery()" aria-label="Clear search">
            <i class="bi" [ngClass]="query ? 'bi-x-circle' : 'bi-search'"></i>
          </button>
          <button class="btn btn-light border" type="button" (click)="toggleSort()" aria-label="Toggle sort">
            <i class="bi" [ngClass]="sortOrder === 'asc' ? 'bi-sort-alpha-down' : 'bi-sort-alpha-down-alt'"></i>
          </button>
          <button class="btn btn-light border" type="button" (click)="loadSubscribers()" aria-label="Refresh">
            <i class="bi bi-arrow-clockwise"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="col-12" *ngIf="loading">
    <div class="card adminuiux-card shadow-sm border-0">
      <div class="card-body text-secondary">Loading subscribers...</div>
    </div>
  </div>

  <div class="col-12" *ngIf="!loading && programList.length > 0 && filteredSubscribers.length === 0">
    <div class="card adminuiux-card shadow-sm border-0">
      <div class="card-body text-secondary">No subscribers found for the current filters.</div>
    </div>
  </div>

  <div *ngFor="let member of filteredSubscribers" class="col-12 col-md-4 col-lg-6 mb-3">
    <button type="button" class="card adminuiux-card shadow-sm overflow-hidden mb-3 community-list-card subscription-card-button" (click)="openUser(member)">
      <div class="card-body">
        <div class="row gx-3 align-items-center h-100">
          <div class="col-auto">
            <figure class="user-list-avatar-md">
              <img *ngIf="member?.image" [src]="userImagePath + member.image" [alt]="member?.firstname">
              <i *ngIf="!member?.image" class="bi bi-person"></i>
            </figure>
          </div>
          <div class="col">
            <h6 class="mb-0">{{ member?.firstname }} {{ member?.lastname }}</h6>
            <p class="small text-secondary mb-2">{{ member?.phone || 'No phone added' }}</p>
            <h6 class="mb-0">{{ member?.email || member?.masjid || '--' }}</h6>
            <p class="small text-secondary mb-2">{{ member?.email ? 'Email' : 'Masjid' }}</p>
          </div>
        </div>
      </div>
    </button>
  </div>

  <app-user-details
    *ngIf="selectedUserId"
    [userId]="selectedUserId"
    [dialogMode]="true"
    (closed)="closeUserDialog()"></app-user-details>
</div>
