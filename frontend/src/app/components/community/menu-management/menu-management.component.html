<div class="menu-management-page">
  <div class="card adminuiux-card shadow-sm border-0">
    <div class="card-body p-3 p-md-4">
      <div class="menu-management-header">
        <div>
          <h1 class="h3 mb-1">Manage Menu</h1>
          <p class="text-secondary mb-0">Turn functional modules on or off for the app menu.</p>
        </div>
        <button type="button" class="btn btn-theme" [disabled]="saving || loading" (click)="save()">
          {{ saving ? 'Saving...' : 'Save Menu' }}
        </button>
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger mt-3 mb-0">{{ errorMessage }}</div>
      <div *ngIf="successMessage" class="alert alert-success mt-3 mb-0">{{ successMessage }}</div>

      <div *ngIf="loading" class="text-secondary mt-4">Loading menu settings...</div>

      <div *ngIf="!loading" class="menu-management-list mt-4">
        <button
          type="button"
          class="menu-management-item"
          *ngFor="let module of modules"
          (click)="toggleModule(module)">
          <span class="menu-management-copy">
            <span class="menu-management-title">{{ module.labelKey | translate }}</span>
            <span class="menu-management-route">{{ module.route }}</span>
          </span>
          <span class="menu-management-toggle" [class.is-enabled]="module.enabled">
            {{ module.enabled ? 'On' : 'Off' }}
          </span>
        </button>
      </div>
    </div>
  </div>
</div>
