<section class="dua-detail-page" *ngIf="dua && category">
  <header *ngIf="!dialogMode; else duaDialogHeader" class="dua-detail-header">
    <button
      type="button"
      class="dua-detail-back-btn"
      (click)="goBack()"
      aria-label="Go back">
      <i class="bi bi-arrow-left"></i>
    </button>
    <div class="dua-detail-header-copy">
      <h1>{{ displayDuaTitle }}</h1>
    </div>
  </header>

  <ng-template #duaDialogHeader>
    <header class="dua-detail-dialog-header">
      <div class="dua-detail-dialog-copy">
        <h5 class="mb-0">{{ displayDuaTitle }}</h5>
        <p class="mb-0 dua-detail-dialog-subtitle">{{ displayCategoryTitle }}</p>
      </div>
      <button
        type="button"
        class="btn-close"
        aria-label="Close detail"
        (click)="goBack()"></button>
    </header>
  </ng-template>

  <article class="dua-detail-card">
    <p class="dua-arabic" dir="rtl" lang="ar">{{ displayArabicText }}</p>
    <p class="dua-transliteration">{{ displayTransliteration }}</p>
    <p class="dua-translation">{{ displayTranslation }}</p>
    <p class="dua-reference">{{ displayReference }}</p>
    <p *ngIf="detailState.note" class="dua-note">
      {{ noteLabel }}: {{ detailState.note }}
    </p>
  </article>

  <div class="dua-detail-actions" aria-label="Dua actions">
    <button
      type="button"
      class="dua-action-btn"
      [class.is-active]="detailState.completed"
      [attr.aria-label]="detailState.completed ? 'Remove completed' : 'Mark completed'"
      (click)="toggleCompleted()">
      <i class="bi" [ngClass]="detailState.completed ? 'bi-check2-circle' : 'bi-check2'"></i>
    </button>
    <button
      type="button"
      class="dua-action-btn"
      [class.is-active]="detailState.favorite"
      [attr.aria-label]="detailState.favorite ? 'Remove favorite' : 'Add favorite'"
      (click)="toggleFavorite()">
      <i class="bi" [ngClass]="detailState.favorite ? 'bi-heart-fill' : 'bi-heart'"></i>
    </button>
  </div>

  <p *ngIf="actionStatus" class="dua-action-status">{{ actionStatus }}</p>
</section>
