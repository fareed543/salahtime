<section class="dua-detail-page" *ngIf="dua && category">
  <header class="dua-detail-header">
    <button type="button" class="dua-detail-back-btn" (click)="goBack()" aria-label="Go back">
      <i class="bi bi-arrow-left"></i>
    </button>
    <div class="dua-detail-header-copy">
      <h1>{{ dua.title }}</h1>
    </div>
  </header>

  <article class="dua-detail-card">
    <p class="dua-arabic">{{ dua.arabic }}</p>
    <p class="dua-transliteration">{{ dua.transliteration }}</p>
    <p class="dua-translation">{{ dua.translation }}</p>
    <p class="dua-reference">{{ dua.reference }}</p>
    <p *ngIf="detailState.note" class="dua-note">
      Note: {{ detailState.note }}
    </p>
  </article>

  <div class="dua-detail-actions" aria-label="Dua actions">
    <button
      type="button"
      class="dua-action-btn"
      [class.is-active]="detailState.completed"
      [attr.aria-label]="detailState.completed ? 'Remove completed' : 'Mark completed'"
      (click)="toggleCompleted()">
      <i class="bi" [ngClass]="detailState.completed ? 'bi-check2-circle' : 'bi-check2'"></i>
    </button>
    <button
      type="button"
      class="dua-action-btn"
      [class.is-active]="detailState.favorite"
      [attr.aria-label]="detailState.favorite ? 'Remove favorite' : 'Add favorite'"
      (click)="toggleFavorite()">
      <i class="bi" [ngClass]="detailState.favorite ? 'bi-heart-fill' : 'bi-heart'"></i>
    </button>
    <button
      type="button"
      class="dua-action-btn"
      [class.is-active]="!!detailState.note"
      aria-label="Edit note"
      (click)="editNote()">
      <i class="bi bi-pencil"></i>
    </button>
    <button
      type="button"
      class="dua-action-btn"
      [class.is-active]="isPlaying"
      [attr.aria-label]="isPlaying ? 'Stop audio' : 'Play audio'"
      (click)="togglePlayback()">
      <i class="bi" [ngClass]="isPlaying ? 'bi-stop-fill' : 'bi-play-fill'"></i>
    </button>
    <button type="button" class="dua-action-btn" aria-label="Share" (click)="shareDua()">
      <i class="bi bi-share"></i>
    </button>
  </div>

  <p *ngIf="actionStatus" class="dua-action-status">{{ actionStatus }}</p>
</section>
