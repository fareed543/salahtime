<section class="dua-list-page" *ngIf="category">
  <app-screen-header
    [title]="displayCategoryTitle"
    [subtitle]="displayCollectionTitle"
    [showBack]="true"
    backFallback="/duas">
  </app-screen-header>

  <div class="dua-list-card">
    <button
      *ngFor="let dua of category.duas"
      type="button"
      class="dua-list-item"
      (click)="openDua(dua)">
      <span class="dua-list-number">{{ dua.id }}.</span>
      <span class="dua-list-copy">
        <span class="dua-list-title">{{ getDisplayDuaTitle(dua) }}</span>
        <span class="dua-list-transliteration">{{ getDisplayTransliteration(dua) }}</span>
      </span>
    </button>
  </div>
</section>
