<div class="auth-screen auth-screen-forgot row align-items-center justify-content-center py-4 mt-auto">
  <div class="col-11 col-sm-8 col-md-11 col-xl-11 col-xxl-10 login-box">
    <div class="mb-4">
      <p class="h4 mb-0">Account recovery</p>
      <h1 class="h2 text-theme-1 auth-title">Reset your password</h1>
      <p class="text-secondary auth-copy">We will send a one-time password to your registered email or mobile.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>
      <div class="alert alert-success" *ngIf="successMessage">{{ successMessage }}</div>

      <div class="btn-group w-100 mb-3" role="group" aria-label="Recovery method">
        <button *ngIf="methods.includes('email')" type="button" class="btn"
          [ngClass]="method === 'email' ? 'btn-theme' : 'btn-outline-secondary'" (click)="selectMethod('email')">
          <i class="bi bi-envelope me-2"></i>Email
        </button>
        <button *ngIf="methods.includes('mobile')" type="button" class="btn"
          [ngClass]="method === 'mobile' ? 'btn-theme' : 'btn-outline-secondary'" (click)="selectMethod('mobile')">
          <i class="bi bi-phone me-2"></i>Mobile
        </button>
      </div>

      <div class="alert alert-warning" *ngIf="method === 'mobile' && !mobileConfigured">
        Mobile OTP delivery is not configured yet.
      </div>

      <div class="form-floating mb-3" *ngIf="method === 'email'">
        <input type="email" class="form-control" id="forgotEmail" placeholder="Enter email address"
          formControlName="email" autocomplete="email">
        <label for="forgotEmail">Registered Email Address</label>
      </div>

      <div class="form-floating mb-3" *ngIf="method === 'mobile'">
        <input type="tel" class="form-control" id="forgotMobile" placeholder="Enter mobile number"
          formControlName="mobile" inputmode="numeric" maxlength="10" autocomplete="tel">
        <label for="forgotMobile">Registered Mobile Number</label>
      </div>

      <button class="btn btn-lg btn-theme w-100 mb-4" type="submit"
        [disabled]="submitting || (method === 'mobile' && !mobileConfigured)">
        {{ submitting ? 'Sending OTP...' : 'Send OTP' }}
      </button>
    </form>
  </div>
</div>
