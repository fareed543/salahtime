<div class="auth-screen auth-screen-reset row gx-3 align-items-center justify-content-center py-4 mt-auto">
  <div class="col-11 col-sm-8 col-md-11 col-xl-11 col-xxl-10 login-box">
    <div class="mb-4">
      <h2 class="mb-0">Create new password</h2>
      <h1 class="fw-bold text-theme-1 auth-title">Reset password</h1>
      <p class="text-secondary mt-2 auth-copy">Choose a new password for your verified account.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>
      <div class="alert alert-success" *ngIf="successMessage">{{ successMessage }}</div>

      <input type="hidden" formControlName="code">

      <div class="position-relative">
        <div class="form-floating mb-3">
          <input [type]="showPassword ? 'text' : 'password'" class="form-control" id="resetPassword"
            placeholder="Enter new password" formControlName="password">
          <label for="resetPassword">New Password</label>
        </div>
        <button class="btn btn-square btn-link text-theme-1 position-absolute end-0 top-0 mt-2 me-2" type="button"
          (click)="togglePassword('password')" aria-label="Toggle password visibility">
          <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
        </button>
      </div>

      <div class="position-relative">
        <div class="form-floating mb-3">
          <input [type]="showConfirmPassword ? 'text' : 'password'" class="form-control" id="resetConfirmPassword"
            placeholder="Confirm new password" formControlName="confirmPassword">
          <label for="resetConfirmPassword">Confirm Password</label>
        </div>
        <button class="btn btn-square btn-link text-theme-1 position-absolute end-0 top-0 mt-2 me-2" type="button"
          (click)="togglePassword('confirm')" aria-label="Toggle confirm password visibility">
          <i class="bi" [ngClass]="showConfirmPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
        </button>
      </div>

      <button class="btn btn-lg btn-theme w-100 mb-3" type="submit" [disabled]="submitting">
        {{ submitting ? 'Updating...' : 'Update password' }}
      </button>
    </form>
  </div>
</div>
