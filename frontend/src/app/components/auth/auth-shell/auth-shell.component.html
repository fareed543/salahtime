<main class="auth-page flex-shrink-0 pt-0 position-relative min-vh-100" aria-label="Authentication">
  <div class="container-fluid z-index-1 position-relative auth-page-inner">
    <div class="auth-wrapper d-flex flex-column minvheight-100">
      <header class="adminuiux-header auth-header">
        <nav class="navbar navbar-expand-lg fixed-top" aria-label="Authentication navigation">
          <div class="container-fluid">
            <button class="btn btn-square btn-link auth-header-back" type="button" (click)="goBack()" aria-label="Go back">
              <i class="bi bi-arrow-left"></i>
            </button>
            <div class="ms-auto" *ngIf="headerAction as action">
              <a [routerLink]="[action.link]" [queryParams]="action.queryParams" class="btn btn-link auth-header-link">{{ action.label }}</a>
            </div>
          </div>
        </nav>
      </header>

      <router-outlet></router-outlet>

      <footer class="adminuiux-footer mt-auto" aria-label="Authentication information">
        <div class="container-fluid text-center">
          <span class="small">© Salah Time. All rights reserved.</span>
        </div>
      </footer>
    </div>
  </div>

  <div class="position-fixed bottom-0 end-0 m-3 z-index-5" id="fixedbuttons">
    <button class="btn btn-square btn-theme shadow rounded-circle" type="button" aria-label="Theme settings">
      <i class="bi bi-palette"></i>
    </button>
  </div>
</main>
