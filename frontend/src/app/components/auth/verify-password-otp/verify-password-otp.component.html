<div class="auth-screen auth-screen-otp row align-items-center justify-content-center py-4 mt-auto">
  <div class="col-11 col-sm-8 col-md-11 col-xl-11 col-xxl-10 login-box">
    <div class="otp-card">
      <div class="otp-icon mx-auto mb-3" aria-hidden="true">
        <i class="bi" [ngClass]="method === 'mobile' ? 'bi-phone' : 'bi-envelope'"></i>
      </div>

      <div class="text-center mb-4">
        <h1 class="h3 fw-bold mb-2">{{ screenTitle }}</h1>
        <p class="text-secondary auth-copy mb-1">
          {{ instructionText }}
        </p>
        <p class="destination mb-0">{{ maskedDestination }}</p>
      </div>

      <form (ngSubmit)="submit()" novalidate>
        <div class="alert alert-danger py-2" *ngIf="errorMessage">{{ errorMessage }}</div>
        <div class="alert alert-success py-2" *ngIf="successMessage">{{ successMessage }}</div>

        <div class="otp-fields mb-2" (paste)="onPaste($event)">
          <input #otpInput *ngFor="let digit of digits; let i = index" type="text" class="otp-field"
            [value]="digit" (input)="onDigitInput(i, $event)" (keydown)="onDigitKeydown(i, $event)"
            inputmode="numeric" maxlength="1" autocomplete="one-time-code" [attr.aria-label]="'OTP digit ' + (i + 1)">
        </div>

        <p class="small text-danger text-center mb-3" *ngIf="submitted && digits.join('').length !== otpLength">
          Enter the complete {{ otpLength }}-digit OTP.
        </p>

        <button class="btn btn-lg btn-theme w-100 mb-3" type="submit" [disabled]="submitting">
          {{ submitting ? 'Verifying...' : submitLabel }}
        </button>

        <div class="resend-row text-center">
          <span class="text-secondary" *ngIf="resendSeconds > 0">
            Resend code available in <strong>{{ countdown }}</strong>
          </span>
          <span class="text-secondary" *ngIf="resendSeconds === 0">
            Didn't receive the code?
            <button class="btn btn-link text-theme-1 p-0 ms-1" type="button" (click)="resendOtp()"
              [disabled]="resending">
              {{ resending ? 'Sending...' : 'Resend' }}
            </button>
          </span>
        </div>
      </form>
    </div>
  </div>
</div>
