<div class="container tasbih-shell">
<div class="row gx-3 mx-0 tasbih-page">
  <div class="col-12">
    <app-screen-header
      [title]="'ZIKAR.TITLE' | translate"
      [subtitle]="currentDuaPositionText"
      [showBack]="true"
      [actions]="headerActions"
      (actionSelected)="onHeaderAction($event)">
    </app-screen-header>
  </div>

  <div class="zikar-category-tabs" role="tablist" aria-label="Zikar categories">
    <button *ngFor="let category of zikarCategories" type="button" role="tab"
      class="zikar-category-tab" [class.active]="selectedCategory === category"
      (click)="setCategory(category)">
      {{ ('ZIKAR.CATEGORIES.' + category.toUpperCase()) | translate }}
    </button>
  </div>

  <div class="col-12">
    <div class="card adminuiux-card shadow-sm border-0 mb-3 tasbih-surface-card">
      <div class="card-body tasbih-dua-card">
        <button
          type="button"
          class="tasbih-dua-nav tasbih-dua-nav-prev"
          [disabled]="state.currentDuaIndex === 0"
          (click)="goToPreviousDua()"
          [attr.aria-label]="'COMMON.PREVIOUS_DAY' | translate"
        >
          <i class="bi bi-chevron-left"></i>
        </button>

        <button
          type="button"
          class="tasbih-dua-nav tasbih-dua-nav-next"
          [disabled]="state.currentDuaIndex >= duas.length - 1"
          (click)="goToNextDua()"
          [attr.aria-label]="'COMMON.NEXT_DAY' | translate"
        >
          <i class="bi bi-chevron-right"></i>
        </button>

        <div class="tasbih-dua-section">
          <p class="tasbih-dua-arabic" dir="rtl" lang="ar">{{ currentDuaArabicText }}</p>
        </div>
        <div class="tasbih-dua-divider"></div>
        <div class="tasbih-dua-section">
          <p class="tasbih-dua-roman">{{ currentLanguageText }}</p>
        </div>
        <div class="tasbih-dua-divider"></div>
        <div class="tasbih-dua-section">
          <p class="tasbih-dua-meaning">{{ currentMeaning }}</p>
        </div>
      </div>
    </div>
  </div>

  <div class="col-12">
    <div class="tasbih-counter-shell">
      <button type="button" class="tasbih-progress-button" (click)="increment()" [attr.aria-label]="'TASBIH.INCREMENT' | translate">
        <svg viewBox="0 0 260 260" class="tasbih-progress-svg" aria-hidden="true">
          <circle class="tasbih-progress-track" cx="130" cy="130" r="116"></circle>
          <circle
            class="tasbih-progress-value-ring"
            cx="130"
            cy="130"
            r="116"
            [attr.stroke-dasharray]="circleCircumference"
            [attr.stroke-dashoffset]="circleDashOffset"
          ></circle>
        </svg>

        <span class="tasbih-counter-copy">
          <h2 class="tasbih-counter-value">{{ progressText }}</h2>
          <p class="tasbih-counter-round">{{ 'TASBIH.ROUNDS' | translate:{ count: displayRound } }}</p>
        </span>
      </button>
    </div>
  </div>

  <div class="col-12">
    <div class="tasbih-counter-actions">
      <button type="button" class="tasbih-step-btn" (click)="decrement()" [attr.aria-label]="'TASBIH.DECREMENT' | translate">
        <i class="bi bi-dash-lg"></i>
      </button>
      <span class="tasbih-swipe-feedback tasbih-swipe-feedback-static" *ngIf="swipeFeedback">{{ swipeFeedback }}</span>
      <button type="button" class="tasbih-floating-edit" (click)="openRoundsDialog()" [attr.aria-label]="'TASBIH.ADJUST_ROUNDS' | translate">
        <i class="bi bi-pencil"></i>
      </button>
    </div>
  </div>

  <div class="col-12">
    <div class="tasbih-help-wrap">
      <p class="tasbih-help">{{ 'TASBIH.COUNT_HINT' | translate }}</p>
    </div>
  </div>
</div>

</div>

<div *ngIf="showRoundsDialog || showCustomTargetDialog" class="tasbih-modal-backdrop" (click)="closeRoundsDialog(); closeCustomTargetDialog()"></div>

<div *ngIf="showRoundsDialog" class="tasbih-modal-sheet tasbih-modal-sheet-bottom">
  <section class="tasbih-modal-card tasbih-modal-card-compact" role="dialog" aria-modal="true" aria-labelledby="rounds-dialog-title" (click)="$event.stopPropagation()">
    <header class="tasbih-modal-header tasbih-modal-header-compact">
      <button type="button" class="btn-close" aria-label="Close rounds dialog" (click)="closeRoundsDialog()"></button>
      <h2 id="rounds-dialog-title" class="h5 mb-0">{{ 'TASBIH.ADJUST_ROUNDS' | translate }}</h2>
      <button type="button" class="btn btn-link text-decoration-none" (click)="closeRoundsDialog()">{{ 'TASBIH.DONE' | translate }}</button>
    </header>

    <div class="tasbih-round-grid">
      <button
        *ngFor="let option of roundOptions"
        type="button"
        class="tasbih-round-card"
        [class.active]="currentDua.target === option"
        (click)="applyRoundTarget(option)"
      >
        {{ option }}
      </button>
      <button type="button" class="tasbih-round-card" (click)="openCustomTargetDialog()">
        {{ 'TASBIH.CUSTOMIZE' | translate }} <i class="bi bi-pencil ms-1"></i>
      </button>
    </div>
  </section>
</div>

<div *ngIf="showCustomTargetDialog" class="tasbih-modal-sheet tasbih-modal-sheet-bottom">
  <section class="tasbih-modal-card tasbih-modal-card-compact" role="dialog" aria-modal="true" aria-labelledby="custom-target-dialog-title" (click)="$event.stopPropagation()">
    <header class="tasbih-modal-header tasbih-modal-header-compact">
      <button type="button" class="btn-close" aria-label="Close custom target dialog" (click)="closeCustomTargetDialog()"></button>
      <h2 id="custom-target-dialog-title" class="h5 mb-0">{{ 'TASBIH.CUSTOM_TARGET_TITLE' | translate }}</h2>
      <button type="button" class="btn btn-link text-decoration-none" (click)="applyCustomTarget()">{{ 'TASBIH.DONE' | translate }}</button>
    </header>

    <div class="tasbih-custom-body">
      <label class="tasbih-custom-label" for="tasbih-custom-target">{{ 'TASBIH.CUSTOM_TARGET_LABEL' | translate }}</label>
      <input
        id="tasbih-custom-target"
        type="number"
        min="1"
        class="form-control"
        [(ngModel)]="customTargetValue"
      >
    </div>
  </section>
</div>
