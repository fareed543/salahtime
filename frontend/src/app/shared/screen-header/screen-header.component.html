<div class="row gx-3 align-items-center mb-3 mx-0 app-screen-header" [class.many-actions]="trailingActions.length > 3">
  <div class="col-auto ps-0" *ngIf="showBack || leadingAction">
    <button
      *ngIf="leadingAction; else builtInBack"
      type="button"
      class="header-back-btn"
      [attr.aria-label]="leadingAction.ariaLabel"
      (click)="onActionClick(leadingAction)">
      <i class="bi" [ngClass]="leadingAction.icon"></i>
    </button>
    <ng-template #builtInBack>
      <button type="button" class="header-back-btn" [attr.aria-label]="backAriaLabel" (click)="onBackClick()">
        <i class="bi bi-arrow-left"></i>
      </button>
    </ng-template>
  </div>
  <div class="col header-main">
    <div class="header-text">
      <h1 class="mb-0 qibla-title">{{ title }}</h1>
      <p *ngIf="subtitle" class="text-theme-1 mb-0 salah-time-range qibla-header-meta">
        {{ subtitle }}
      </p>
    </div>
  </div>
  <div class="col-auto text-end" *ngIf="trailingActions.length">
    <div class="header-actions" role="group" [attr.aria-label]="actionGroupLabel">
      <button
        *ngFor="let action of trailingActions; trackBy: trackByActionId"
        type="button"
        class="header-action-btn"
        [class.active]="action.active"
        [disabled]="action.disabled"
        [attr.aria-label]="action.ariaLabel"
        [attr.aria-pressed]="action.toggle ? !!action.active : null"
        (click)="onActionClick(action)">
        <i class="bi" [ngClass]="action.icon"></i>
      </button>
    </div>
    <!-- Phones with more than three actions: one ⋮ button opening a labelled list (CSS picks which shows). -->
    <div class="header-more" *ngIf="trailingActions.length > 3">
      <button #moreButton type="button" class="header-action-btn" [class.active]="moreOpen"
        aria-haspopup="menu" [attr.aria-expanded]="moreOpen" [attr.aria-label]="moreLabel"
        (click)="toggleMore($event)">
        <i class="bi bi-three-dots-vertical"></i>
      </button>
      <div class="header-more-menu" role="menu" *ngIf="moreOpen" [attr.aria-label]="actionGroupLabel" (click)="$event.stopPropagation()">
        <button
          *ngFor="let action of trailingActions; trackBy: trackByActionId"
          type="button"
          [attr.role]="action.toggle ? 'menuitemcheckbox' : 'menuitem'"
          [attr.aria-checked]="action.toggle ? !!action.active : null"
          [class.danger]="action.danger"
          [disabled]="action.disabled"
          (click)="onMenuActionClick(action, moreButton)">
          <i class="bi" [ngClass]="action.icon" aria-hidden="true"></i>{{ action.ariaLabel }}
        </button>
      </div>
    </div>
  </div>
</div>
