<section class="card border-0 shadow-lg app-dialog settings-dialog">
  <div class="app-dialog-header settings-dialog-header">
    <h5 id="settings-dialog-title" class="mb-0">{{ 'DASHBOARD.SETTINGS_TITLE' | translate }}</h5>
    <button type="button" class="btn-close" mat-dialog-close
      [aria-label]="'DASHBOARD.CLOSE_SETTINGS_ARIA' | translate"></button>
  </div>
  <div class="app-dialog-body settings-dialog-body">
    <app-settings></app-settings>
  </div>
</section>
