<div class="adminuiux-search-full active">
  <div class="row gx-2 align-items-center position-relative">

    <!-- City Search Input -->
    <div class="col position-relative">
      <input class="form-control pe-5 border-0" type="search" placeholder="Search city..." [(ngModel)]="cityInput"
        (ngModelChange)="onInputChange($event)" (focus)="onInputChange(cityInput)" (blur)="hideDropdown()" />

      <!-- Autocomplete Dropdown -->
      <ul class="list-group position-absolute w-100 mt-1" *ngIf="filteredLocations.length > 0"
        style="z-index: 1050; max-height: 250px; overflow-y: auto;">
        <li class="list-group-item list-group-item-action" *ngFor="let loc of filteredLocations"
          (mousedown)="selectCity(loc)">
          <i class="bi bi-geo-alt me-2"></i>
          {{ loc.city }}, {{ loc.state }}
        </li>
      </ul>
    </div>

    <!-- Current Location Icon -->
    <div class="col-auto">
      <button class="btn btn-link btn-square" type="button" title="Use current location" (click)="useCurrentLocation()">
        <i class="bi bi-crosshair fs-4"></i>
      </button>
    </div>

    <div class="col-auto">
      <button class="btn btn-link btn-square" type="button" title="Open settings" (click)="openSettings()">
        <i class="bi bi-gear fs-4"></i>
      </button>
    </div>
  </div>

</div>
