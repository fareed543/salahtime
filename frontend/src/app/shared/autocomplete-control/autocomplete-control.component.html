<div class="adminuiux-search-full active">
  <div class="row gx-2 align-items-center position-relative">

    <!-- City Search Input -->
    <div class="col position-relative">
      <input class="form-control pe-5 border-0" type="search" [placeholder]="'LOCATION_DIALOG.SEARCH_CITY_PLACEHOLDER' | translate" [(ngModel)]="cityInput"
        (ngModelChange)="onInputChange($event)" (focus)="onInputChange(cityInput)" (blur)="hideDropdown()" />

      <!-- Autocomplete Dropdown -->
      <ul class="list-group position-absolute w-100 mt-1" *ngIf="filteredLocations.length > 0"
        style="z-index: 1050; max-height: 250px; overflow-y: auto;">
        <li class="list-group-item list-group-item-action" *ngFor="let loc of filteredLocations"
          (mousedown)="selectCity(loc)">
          <i class="bi bi-geo-alt me-2"></i>
          {{ loc.city }}, {{ loc.state }}
        </li>
      </ul>
    </div>

    <!-- Current Location Icon -->
    <div class="col-auto">
      <button
        class="btn btn-link btn-square"
        type="button"
        [title]="(isUsingCurrentLocation ? 'LOCATION_DIALOG.REFRESH_CURRENT_LOCATION' : 'LOCATION_DIALOG.USE_CURRENT_LOCATION') | translate"
        [disabled]="isFetchingLocation"
        (click)="openLocationDialog()">
        <i class="bi bi-crosshair fs-4"></i>
      </button>
    </div>

    <div class="col-auto">
      <button class="btn btn-link btn-square" type="button" [title]="'LOCATION_DIALOG.OPEN_SETTINGS' | translate" (click)="openSettings()">
        <i class="bi bi-gear fs-4"></i>
      </button>
    </div>
  </div>

</div>

<div *ngIf="showLocationDialog" class="location-dialog-backdrop" (click)="closeLocationDialog()"></div>
<div *ngIf="showLocationDialog" class="location-dialog-wrap" role="dialog" aria-modal="true" aria-labelledby="location-dialog-title">
  <section class="location-dialog-card" (click)="$event.stopPropagation()">
    <button type="button" class="btn-close location-dialog-close" [attr.aria-label]="'LOCATION_DIALOG.CLOSE' | translate" (click)="closeLocationDialog()"></button>

    <ng-container *ngIf="locationDialogStep === 'options'; else manualLocationSearch">
      <div class="location-dialog-screen">
        <div class="location-dialog-hero">
          <img src="assets/images/location.png" [attr.alt]="'LOCATION_DIALOG.LOCATION_ALT' | translate" class="location-dialog-art">
        </div>

        <h2 id="location-dialog-title" class="location-dialog-title">{{ 'LOCATION_DIALOG.TITLE' | translate }}</h2>
        <p class="location-dialog-subtitle">{{ 'LOCATION_DIALOG.SUBTITLE' | translate }}</p>

        <div *ngIf="selectedLocationLabel" class="location-dialog-selected" aria-live="polite">
          <i class="bi bi-geo-alt-fill" aria-hidden="true"></i>
          <div>
            <small>{{ 'LOCATION_DIALOG.CURRENTLY_SELECTED' | translate }}</small>
            <strong>{{ selectedLocationLabel }}</strong>
          </div>
          <i class="bi bi-check-circle-fill location-dialog-selected-check" aria-hidden="true"></i>
        </div>

        <button
          type="button"
          class="location-dialog-primary"
          (click)="useCurrentLocationFromDialog()"
          [disabled]="isFetchingLocation">
          <span>{{ 'LOCATION_DIALOG.USE_CURRENT_LOCATION' | translate }}</span>
          <small>{{ isFetchingLocation ? ('LOCATION_DIALOG.DETECTING' | translate) : ('LOCATION_DIALOG.DETECT_VIA_GPS' | translate) }}</small>
        </button>

        <div class="location-dialog-divider">{{ 'LOCATION_DIALOG.OR' | translate }}</div>

        <button type="button" class="location-dialog-secondary" (click)="openManualLocationSearch()">
          <span>{{ 'LOCATION_DIALOG.SEARCH_MANUALLY' | translate }}</span>
          <small>{{ 'LOCATION_DIALOG.FIND_CITY_OR_ADDRESS' | translate }}</small>
        </button>
      </div>
    </ng-container>

    <ng-template #manualLocationSearch>
      <div class="location-dialog-screen location-dialog-search-screen">
        <div class="location-dialog-search-header">
          <button type="button" class="location-dialog-back-btn" (click)="locationDialogStep = 'options'">
            <i class="bi bi-arrow-left"></i>
          </button>
          <h2 id="location-dialog-title" class="location-dialog-search-title">{{ 'LOCATION_DIALOG.SEARCH_LOCATION' | translate }}</h2>
        </div>

        <div class="location-dialog-search-box">
          <i class="bi bi-search"></i>
          <input
            type="search"
            [ngModel]="dialogSearchQuery"
            (ngModelChange)="onDialogSearchChange($event)"
            [placeholder]="'LOCATION_DIALOG.FIND_CITY_OR_ADDRESS' | translate">
        </div>

        <div class="location-dialog-search-results">
          <button
            *ngFor="let location of dialogFilteredLocations"
            type="button"
            class="location-dialog-search-result"
            (click)="selectCityFromDialog(location)">
            <span>{{ location.city }}, {{ location.state }}, {{ location.country }}</span>
          </button>
        </div>
      </div>
    </ng-template>
  </section>
</div>
