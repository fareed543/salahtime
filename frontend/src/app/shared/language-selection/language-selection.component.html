<ng-container *ngIf="!dialogMode; else dialogLanguageList">
  <button
    class="btn btn-link btn-square btn-icon btn-link-header dropdown-toggle no-caret"
    type="button"
    data-bs-toggle="dropdown"
    aria-expanded="false"
    [attr.aria-label]="'COMMON.SELECT_LANGUAGE' | translate"
  >
    <i class="bi bi-translate"></i>
  </button>

  <ul class="dropdown-menu dropdown-menu-end">
    <li *ngFor="let lang of i18n.availableWithNames()">
      <a
        class="dropdown-item"
        [class.active]="i18n.current() === lang.code"
        (click)="changeLang(lang.code)"
      >
        {{ lang.name }}
      </a>
    </li>
  </ul>
</ng-container>

<ng-template #dialogLanguageList>
  <div class="language-dialog-list">
    <button
      *ngFor="let lang of i18n.availableWithNames()"
      type="button"
      class="language-dialog-item"
      [class.active]="i18n.current() === lang.code"
      (click)="changeLang(lang.code)">
      <span>{{ lang.name }}</span>
      <i *ngIf="i18n.current() === lang.code" class="bi bi-check2"></i>
    </button>
  </div>
</ng-template>
