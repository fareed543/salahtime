<div class="app-offline-screen" *ngIf="offline$ | async">
  <div class="app-offline-card">
    <div class="app-offline-icon">
      <i class="bi bi-wifi-off"></i>
    </div>
    <h3 class="mb-2">{{ 'OFFLINE.TITLE' | translate }}</h3>
    <p class="text-secondary mb-4">
      {{ 'OFFLINE.SUBTITLE' | translate }}
    </p>
    <button class="btn btn-theme btn-lg w-100" type="button" (click)="reload()">{{ 'COMMON.RELOAD' | translate }}</button>
  </div>
</div>
